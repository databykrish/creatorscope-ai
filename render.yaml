services:
  - type: web
    name: creatorscope-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://creatorscope-ai.vercel.app,https://creatorscope-ai-staging.vercel.app
      - key: YTDLP_ENABLED
        value: "true"
      - key: PORT
        value: "8000"
    buildCommand: "pip install -r backend/requirements.txt"
